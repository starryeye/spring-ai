spring:
  ai:
    model:
      chat: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
        # 툴 콜링에는 낮은 온도가 유리하다. 로컬 모델은 온도가 높으면
        # 툴을 부르지 않고 답을 지어내는 경향이 커진다.
        temperature: 0.1
        # qwen3 는 thinking 모델이다. 이 값이 정확도와 속도를 크게 가른다 (실측):
        #
        #   미지정  기본 thinking. "10만원 넘는 상품은?" 에서 5145 토큰을 생성하며 6분 39초.
        #           툴을 아예 호출하지 않고 끝나기도 한다. 쓸 수 없다.
        #   false   thinking 끔. 5초로 빨라지지만 툴 설명을 제대로 따르지 못한다.
        #           가격 조건을 키워드로 넘겨(keyword=10만원) "상품이 없다"는 오답을 냈다.
        #   low     최소 추론. 34~105초. 아래 세 질문 모두 정답.
        #           가격 조건 질문에서 키워드 없이 전체를 받아 직접 거르는 판단을 해냈다.
        #
        # 정확성을 기본으로 두고 low 를 쓴다. 질문이 단순하고 속도가 급하면 false 도 선택지다.
        think: low
# 모델은 미리 받아둬야 한다 (자동 pull 안 함 — init.pull-model-strategy 기본값이 never):
#   ollama pull qwen3:8b
