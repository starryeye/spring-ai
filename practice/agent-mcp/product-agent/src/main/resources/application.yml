server:
  port: 8080

spring:
  application:
    name: product-agent
  ai:
    model:
      chat: openai          # 기본 프로바이더. 프로파일에서 덮어쓴다.
    mcp:
      client:
        enabled: true
        type: ASYNC
        streamable-http:
          connections:
            product:
              url: "http://localhost:8082"   # base URL, endpoint 는 기본 /mcp

logging:
  level:
    org.springframework.ai: INFO
