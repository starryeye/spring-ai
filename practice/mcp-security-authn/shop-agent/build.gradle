plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.starryeye'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// webflux 가 아닌 기본(HttpClient 기반) MCP 클라이언트 스타터다.
	// mcp-client-security 는 HttpClientStreamableHttpTransport 를 커스터마이즈한다.
	implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
	implementation 'org.springaicommunity:mcp-client-security-spring-boot:0.1.14'
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// spring-boot-starter-test 는 웹 슬라이스에 대해 알지 못하므로 Boot 4.1 모듈 분리 이후
	// AutoConfigureMockMvc 를 쓰려면 이 모듈을 명시적으로 추가해야 한다.
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
