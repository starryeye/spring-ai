server:
  # 서버가 연결을 받을 네트워크 주소다. 127.0.0.1이면 이 기기 안에서만 접속할 수 있다.
  # MCP 2025-11-25 Transports는 로컬에서 도는 서버가 localhost(127.0.0.1)에만 bind하기를 권한다(SHOULD).
  # 실제 배포에서 container나 reverse proxy 뒤에 둔다면 0.0.0.0(모든 interface)이나
  # 그 네트워크의 interface 주소를 쓴다. 외부에 무엇을 열지는 proxy와 방화벽이 정한다.
  address: 127.0.0.1
  port: 8150
  servlet:
    session:
      cookie:
        name: STATELESSAGENTSESSIONID
        # 다른 사이트의 페이지가 <img> 같은 subresource로 이 session cookie를 실어 GET을 보내는 것을 막는다.
        # lax는 최상위 GET 이동(예: Authorization Server의 callback redirect, localhost:9040 → localhost:8150)은
        # 그대로 허용하므로 login 흐름은 깨지지 않는다.
        same-site: lax

spring:
  application:
    name: stateless-shop-agent
  ai:
    model:
      chat: ollama
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    ollama:
      chat:
        model: qwen3:8b
        temperature: 0.1
        think: low
    mcp:
      client:
        enabled: true
        # SYNC로 고정한다. McpSecurityConfig의 mcpAuthenticationCustomizer는
        # McpClientCustomizer<McpClient.SyncSpec> 타입이라, ASYNC로 바꾸면 오류는 나지 않지만 이 customizer가 적용되지 않는다.
        # 그러면 transport context가 늘 비어 token이 붙지 않는다.
        type: SYNC
        # 기동할 때는 대신할 사용자가 없어 token도 없다. MCP Server는 token 없는 요청에 모두 401을 준다.
        # 기동 중에 initialize를 보내면 실패해 application context가 뜨지 못하므로, 첫 요청으로 미룬다.
        initialized: false
        streamable-http:
          connections:
            shop:
              url: "http://localhost:8151"
  security:
    oauth2:
      client:
        registration:
          # 여기에는 credentials만 둔다. Authorization Server의 endpoint는 설정에 적지 않고
          # MCP Server에 물어서 알아낸다(McpAuthorizationDiscovery).
          authserver:
            client-id: stateless-shop-agent
            client-secret: stateless-shop-agent-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # scope는 적지 않는다. openid에 discovery가 고른 scope(401의 scope → PRM의 scopes_supported)를 더해 요청한다.

mcp:
  authorization:
    # discovery의 출발점이다. 이 URL 하나만 알면 Authorization Server는 discovery로 찾는다.
    resource-url: http://localhost:8151/mcp
    # 위 credentials가 등록된 Authorization Server다. discovery 결과가 다르면 credentials를 보내지 않는다.
    credentials-issuer: http://localhost:9040

logging:
  level:
    org.springframework.ai: INFO
    dev.starryeye.stateless.agent: DEBUG
