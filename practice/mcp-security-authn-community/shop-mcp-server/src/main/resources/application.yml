server:
  # 서버가 연결을 받을 네트워크 주소. 127.0.0.1 이면 이 기기 안에서만 접속할 수 있다
  # (MCP 2025-11-25 Transports: 로컬에서 도는 서버는 localhost(127.0.0.1)에만 bind 하는 것이 좋다, SHOULD).
  # 실제 배포에서는 컨테이너·reverse proxy 뒤라면 0.0.0.0(모든 인터페이스)이나 그 네트워크의 인터페이스
  # 주소를 쓰고, 외부에 무엇을 열지는 proxy·방화벽이 정한다.
  address: 127.0.0.1
  port: 8101

spring:
  application:
    name: shop-mcp-server
  ai:
    mcp:
      server:
        name: shop-mcp-server
        version: 0.0.1
        protocol: STREAMABLE
        # SYNC 다. ASYNC 였던 앞 practice 와 반대이고,
        # @McpTool 이 Mono 를 반환하면 조용히 등록에서 빠진다.
        type: SYNC
  security:
    oauth2:
      resourceserver:
        jwt:
          # 토큰 서명 검증용 JWK 와 iss 검증의 기준이고,
          # 보호 리소스 메타데이터의 authorization_servers 값이기도 하다.
          issuer-uri: http://localhost:9000

logging:
  level:
    org.springframework.ai: INFO
    org.springaicommunity.mcp.security: DEBUG
