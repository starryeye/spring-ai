server:
  port: 8101

spring:
  application:
    name: shop-mcp-server
  ai:
    mcp:
      server:
        name: shop-mcp-server
        version: 0.0.1
        protocol: STREAMABLE
        # SYNC 다. ASYNC 였던 앞 practice 와 반대이고,
        # @McpTool 이 Mono 를 반환하면 조용히 등록에서 빠진다.
        type: SYNC
  security:
    oauth2:
      resourceserver:
        jwt:
          # 토큰 서명 검증용 JWK 와 iss 검증의 기준이고,
          # 보호 리소스 메타데이터의 authorization_servers 값이기도 하다.
          issuer-uri: http://localhost:9000

logging:
  level:
    org.springframework.ai: INFO
    org.springaicommunity.mcp.security: DEBUG
