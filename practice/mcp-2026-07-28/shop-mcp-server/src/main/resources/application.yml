server:
  # 서버가 연결을 받을 네트워크 주소다.
  # 127.0.0.1이면 이 기기 안에서만 접속할 수 있다.
  # MCP Transports(2026-07-28 Streamable HTTP)는 로컬에서 도는 서버가 localhost(127.0.0.1)에만 bind하기를 권한다(SHOULD).
  # 실제 배포에서 container나 reverse proxy 뒤에 둔다면 0.0.0.0(모든 interface)이나 그 네트워크의 interface 주소를 쓴다.
  # 외부에 무엇을 열지는 proxy와 방화벽이 정한다.
  address: 127.0.0.1
  port: 8181

spring:
  application:
    name: modern-shop-mcp-server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9070
          # RFC 8707로 정한 aud를 검증한다.
          # 이 값이 없으면 같은 Authorization Server가 발급한 다른 resource용 token도 그대로 통과한다(confused deputy).
          audiences: http://localhost:8181/mcp

mcp:
  limits:
    # MCP transport가 메모리에 올리는 요청 본문의 상한이다.
    # 넘으면 413이다.
    # Tomcat의 max-post-size는 form 본문에만 적용되어 JSON 본문을 막지 못한다.
    max-request-body: 1MB
    # 사용자(token의 sub)마다 1분 동안 부를 수 있는 tools/call 수다.
    # 넘으면 429와 Retry-After다.
    # MCP Tools 명세는 서버가 tool 호출 속도를 제한하라고 한다(MUST).
    tool-calls-per-minute: 60

logging:
  level:
    io.modelcontextprotocol: INFO
    org.springframework.security: DEBUG
