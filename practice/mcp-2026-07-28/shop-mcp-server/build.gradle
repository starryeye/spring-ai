plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.starryeye'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// 공식 resource server.
	// community 버전의 mcp-server-security-spring-boot를 대체한다.
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	// MCP 2026-07-28 서버(io.modelcontextprotocol.modern)와 Jackson 3 mapper가 들어 있다.
	// pre-release라 버전을 고정한다.
	// Spring AI는 아직 이 서버를 감싸지 않아 쓰지 않는다.
	implementation 'io.modelcontextprotocol.sdk:mcp:2.2.0-M1'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
