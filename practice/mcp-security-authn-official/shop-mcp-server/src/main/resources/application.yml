server:
  port: 8111

spring:
  application:
    name: official-shop-mcp-server
  ai:
    mcp:
      server:
        name: official-shop-mcp-server
        version: 0.0.1
        protocol: STREAMABLE
        # SYNC. @McpTool 이 Mono 를 반환하면 조용히 등록에서 빠진다.
        type: SYNC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9010
          # RFC 8707 로 발급된 aud 를 검증한다. 이 값이 없으면 같은 인가 서버가 발급한
          # 다른 리소스용 토큰도 그대로 통과한다(confused deputy).
          audiences: http://localhost:8111/mcp

logging:
  level:
    org.springframework.ai: INFO
    org.springframework.security: DEBUG
