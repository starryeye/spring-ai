server:
  # 서버가 연결을 받을 네트워크 주소. 127.0.0.1 이면 이 기기 안에서만 접속할 수 있다
  # (MCP 2025-11-25 Transports: 로컬에서 도는 서버는 localhost(127.0.0.1)에만 bind 하는 것이 좋다, SHOULD).
  # 실제 배포에서는 컨테이너·reverse proxy 뒤라면 0.0.0.0(모든 인터페이스)이나 그 네트워크의 인터페이스
  # 주소를 쓰고, 외부에 무엇을 열지는 proxy·방화벽이 정한다.
  address: 127.0.0.1
  port: 8110
  servlet:
    session:
      cookie:
        name: OFFICIALAGENTSESSIONID

spring:
  application:
    name: official-shop-agent
  ai:
    model:
      chat: ollama
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    ollama:
      chat:
        model: qwen3:8b
        temperature: 0.1
        think: low
    mcp:
      client:
        enabled: true
        # SYNC 고정. McpSecurityConfig 의 mcpAuthenticationCustomizer 는
        # McpClientCustomizer<McpClient.SyncSpec> 타입이라 ASYNC 로 바꾸면
        # 조용히 적용되지 않는다 — 전송 컨텍스트가 항상 비어 토큰이 붙지 않는다.
        type: SYNC
        # 부팅 시점에는 대신할 사용자가 없다. 서버가 모든 요청에 401 을 주므로
        # 기동 중 핸드셰이크가 실패해 컨텍스트가 죽는다. 첫 요청으로 미룬다.
        initialized: false
        streamable-http:
          connections:
            shop:
              url: "http://localhost:8111"
  security:
    oauth2:
      client:
        registration:
          # 여기에는 자격증명만 둔다. 인가 서버의 엔드포인트는 설정에 적지 않고
          # MCP 서버에게 물어서 알아낸다(McpAuthorizationDiscovery).
          authserver:
            client-id: official-shop-agent
            client-secret: official-shop-agent-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile

mcp:
  authorization:
    # 발견의 출발점. 이 URL 하나만 알면 인가 서버는 따라온다.
    resource-url: http://localhost:8111/mcp
    # 위 자격증명이 등록된 인가 서버. 발견 결과가 다르면 자격증명을 보내지 않는다.
    credentials-issuer: http://localhost:9010

logging:
  level:
    org.springframework.ai: INFO
    dev.starryeye.officialagent: DEBUG
