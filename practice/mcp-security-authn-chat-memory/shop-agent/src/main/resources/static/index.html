<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>memory shop-agent</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; font-size: 13px; color: #555; }
        input { width: 100%; padding: 8px; font-size: 15px; box-sizing: border-box; }
        .row { display: flex; gap: 8px; align-items: flex-end; }
        .row > div { flex: 1; }
        button { padding: 8px 14px; font-size: 14px; white-space: nowrap; margin-top: 8px; }
        pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; min-height: 4em; }
    </style>
</head>
<body>
<h1>shop-agent</h1>
<p>로그인한 사용자를 대신해 MCP 서버의 툴을 호출합니다. 예: <code>노트북 재고 있어?</code></p>
<p>대화는 로그인한 사용자별로 격리됩니다. label 만 골라 보내면 서버가 사용자 접두사를 붙입니다.</p>

<div class="row">
    <div>
        <label for="label">대화 label</label>
        <input id="label" value="default">
    </div>
    <button id="dump">저장 내용 보기</button>
    <button id="clear">이 대화 비우기</button>
</div>

<label for="q">질문</label>
<input id="q" placeholder="질문을 입력하세요" autofocus>
<button id="send">보내기</button>

<pre id="out"></pre>

<script>
    const out = document.getElementById('out');
    const label = document.getElementById('label');
    const q = document.getElementById('q');
    const send = document.getElementById('send');

    document.getElementById('dump').addEventListener('click', async () => {
        try {
            const res = await fetch('/api/conversations/' + encodeURIComponent(label.value));
            if (!res.ok) {
                out.textContent = '오류: HTTP ' + res.status;
                return;
            }
            out.textContent = JSON.stringify(await res.json(), null, 2);
        } catch (e) {
            out.textContent = '오류: ' + e;
        }
    });

    document.getElementById('clear').addEventListener('click', async () => {
        try {
            const res = await fetch('/api/conversations/' + encodeURIComponent(label.value), {method: 'DELETE'});
            if (!res.ok) {
                out.textContent = '오류: HTTP ' + res.status;
                return;
            }
            out.textContent = '비웠습니다: ' + label.value;
        } catch (e) {
            out.textContent = '오류: ' + e;
        }
    });

    async function ask() {
        const message = q.value.trim();
        if (!message) return;
        q.value = '';
        send.disabled = true;
        out.textContent = '생각 중... (로컬 모델은 30~100초 걸립니다)';
        try {
            const res = await fetch('/api/chat?label=' + encodeURIComponent(label.value),
                    {method: 'POST', body: message});
            if (!res.ok) {
                out.textContent = '오류: HTTP ' + res.status;
                return;
            }
            out.textContent = '';
            const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
            for (;;) {
                const {value, done} = await reader.read();
                if (done) break;
                out.textContent += value;
            }
        } catch (e) {
            out.textContent = '오류: ' + e;
        } finally {
            send.disabled = false;
        }
    }

    send.addEventListener('click', ask);
    q.addEventListener('keydown', e => { if (e.key === 'Enter' && !send.disabled) ask(); });
</script>
</body>
</html>
