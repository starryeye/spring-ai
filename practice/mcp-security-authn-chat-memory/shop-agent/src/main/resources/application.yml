chat:
  memory:
    # 줄여서 재기동하면 창이 밀리는 것을 관측할 수 있다.
    max-messages: 20

server:
  # 서버가 연결을 받을 네트워크 주소. 127.0.0.1 이면 이 기기 안에서만 접속할 수 있다
  # (MCP 2025-11-25 Transports: 로컬에서 도는 서버는 localhost(127.0.0.1)에만 bind 하는 것이 좋다, SHOULD).
  # 실제 배포에서는 컨테이너·reverse proxy 뒤라면 0.0.0.0(모든 인터페이스)이나 그 네트워크의 인터페이스
  # 주소를 쓰고, 외부에 무엇을 열지는 proxy·방화벽이 정한다.
  address: 127.0.0.1
  port: 8130
  servlet:
    session:
      cookie:
        name: MEMAGENTSESSIONID

spring:
  application:
    name: memory-shop-agent
  ai:
    model:
      chat: ollama
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    ollama:
      chat:
        model: qwen3:8b
        temperature: 0.1
        think: low
    mcp:
      client:
        # MCP client 자동 구성을 끈다. client 는 사용자마다 따로 만든다(UserMcpClients) —
        # 자동 구성의 client 하나를 모든 사용자가 나눠 쓰면 MCP Server 가 session 을 사용자에 묶을 수 없다.
        # 연결 주소는 mcp.authorization.resource-url 을 쓴다.
        enabled: false
  security:
    oauth2:
      client:
        registration:
          # 여기에는 자격증명만 둔다. 인가 서버의 엔드포인트는 설정에 적지 않고
          # MCP 서버에게 물어서 알아낸다(McpAuthorizationDiscovery).
          authserver:
            client-id: memory-agent
            client-secret: memory-agent-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile

mcp:
  authorization:
    # 발견의 출발점. 이 URL 하나만 알면 인가 서버는 따라온다.
    resource-url: http://localhost:8131/mcp
    # 위 자격증명이 등록된 인가 서버. 발견 결과가 다르면 자격증명을 보내지 않는다.
    credentials-issuer: http://localhost:9020

logging:
  level:
    org.springframework.ai: INFO
    dev.starryeye.memoryauthn.agent: DEBUG
