server:
  # 서버가 연결을 받을 네트워크 주소. 127.0.0.1 이면 이 기기 안에서만 접속할 수 있다
  # (MCP 2025-11-25 Transports: 로컬에서 도는 서버는 localhost(127.0.0.1)에만 bind 하는 것이 좋다, SHOULD).
  # 실제 배포에서는 컨테이너·reverse proxy 뒤라면 0.0.0.0(모든 인터페이스)이나 그 네트워크의 인터페이스
  # 주소를 쓰고, 외부에 무엇을 열지는 proxy·방화벽이 정한다.
  address: 127.0.0.1
  port: 8131

spring:
  application:
    name: memory-shop-mcp-server
  ai:
    mcp:
      server:
        name: memory-shop-mcp-server
        version: 0.0.1
        protocol: STREAMABLE
        # SYNC. @McpTool 이 Mono 를 반환하면 조용히 등록에서 빠진다.
        type: SYNC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9020
          # RFC 8707로 발급된 aud를 검증한다.
          # 이 값이 없으면 같은 Authorization Server가 발급한 다른 리소스용 token도 그대로 통과한다(confused deputy).
          audiences: http://localhost:8131/mcp

mcp:
  limits:
    # 서버가 한꺼번에 들고 있는 MCP session 수의 상한이다. 넘으면 새 initialize가 503이다.
    # 사용자마다 세지 않고 서버 전체로 센다. 한 사용자가 채우면 다른 사용자의 initialize도 503이 된다.
    max-sessions: 1000
    # 요청이 이만큼 없던 session은 지운다. 지운 session으로 온 요청은 404이고, client는 새 session을 연다.
    # McpSessionBindingFilter도 같은 값으로 session의 묶음을 지운다. 두 값이 어긋나지 않도록 하나만 둔다.
    session-idle-timeout: 1h

logging:
  level:
    org.springframework.ai: INFO
    org.springframework.security: DEBUG
